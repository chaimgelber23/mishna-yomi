name: Cloudflare Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/cloudflare-build-check.yml'

jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Next build
        run: npm run build
      - name: Cloudflare Pages adapter build
        run: npx @cloudflare/next-on-pages
